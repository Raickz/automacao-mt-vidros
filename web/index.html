<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Replaced by the value of `flutter build --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Digitalize o molde do cliente e gere o arquivo DXF para a mesa de corte CNC.">
  <meta name="theme-color" content="#012B40">
  <!--
    Só arquivos do próprio site (o app não usa CDN nem serviços de fora).
    'wasm-unsafe-eval': o motor gráfico do Flutter é WebAssembly.
    blob:/data: para as fotos e arquivos gerados no próprio aparelho.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MT Vidros">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Começa a baixar o app junto com a página, sem esperar o bootstrap. -->
  <link rel="preload" href="main.dart.js" as="script">

  <title>Marabá Temper — Digitalização de Moldes</title>
  <style>
    html, body { background: #012B40; margin: 0; height: 100%; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #012B40; transition: opacity .25s ease; z-index: 10;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #8FB2BF; font-size: 15px;
    }
    #splash img { width: 96px; height: 96px; border-radius: 18px; }
    #splash .bar { width: 160px; height: 3px; background: #0B4D6E; border-radius: 2px; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #1BBFBB;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
    #update-bar {
      position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; gap: 14px; align-items: center; padding: 10px 12px 10px 16px;
      background: #013D59; color: #E6F2F4; border: 1px solid #17607F; border-radius: 6px;
      font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; z-index: 20;
      box-shadow: 0 6px 24px rgba(0,0,0,.35); max-width: calc(100vw - 32px);
    }
    #update-bar button {
      background: #1BBFBB; color: #032A2A; border: 0; border-radius: 4px; padding: 8px 14px;
      font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer;
    }
  </style>
  <script src="boot.js"></script>
</head>
<body>
  <div id="splash" aria-label="Carregando o app">
    <img src="icons/Icon-192.png" alt="Marabá Temper">
    <div class="bar"></div>
    <div>Carregando…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
