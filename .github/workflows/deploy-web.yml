name: Deploy Web (teste)

# Todo PR para main roda analyze, testes e build; só o push na main publica.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions fixadas por SHA (o comentário diz a versão), para uma tag
      # movida não trocar o código que roda aqui.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # --no-web-resources-cdn: o CanvasKit vai junto no site, sem baixar do
      # CDN do Google (funciona offline como PWA e não depende de terceiros).
      - run: flutter build web --base-href /automacao-mt-vidros/ --no-web-resources-cdn

      # Versão do cache do app (commit) e do motor gráfico (revisão do Flutter)
      # no service worker: o celular só baixa de novo o que mudou.
      - name: Versionar o service worker
        run: |
          ENGINE=$(grep -o '"engineRevision":"[a-f0-9]*"' build/web/flutter_bootstrap.js | head -1 | cut -d'"' -f4)
          test -n "$ENGINE"
          sed -i "s/__BUILD__/${GITHUB_SHA}/; s/__ENGINE__/${ENGINE}/" build/web/sw.js
          ! grep -q "__BUILD__\|__ENGINE__" build/web/sw.js

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
